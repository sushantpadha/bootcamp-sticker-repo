server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # Redirect all HTTP to HTTPS once certbot is configured.
    # Uncomment after running certbot:
    # return 301 https://$host$request_uri;

    root /var/www/sticker-repo;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        font/woff
        font/woff2;

    # Long-lived cache for hashed assets (JS/CSS bundles, fonts, images)
    location ~* \.(js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html must never be cached so deploys take effect immediately
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Client-side routing fallback — any path that doesn't match a file
    # gets served index.html so the SPA router can handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

